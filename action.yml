name: code-erosion
description: >-
  Score a repo with the SlopCodeBench verbosity/erosion metrics, diff against
  the committed baseline, post the delta as a PR comment, and (in gate mode)
  fail the check when erosion regresses past the threshold. On pushes to the
  default branch it can also record the scan to a committed trend-history file
  and update a README badge.
branding:
  icon: activity
  color: orange
inputs:
  path:
    description: Directory to scan, relative to the checkout root.
    required: false
    default: "."
  baseline:
    description: Baseline file, committed in the scanned repo.
    required: false
    default: ".code-erosion.json"
  mode:
    description: >-
      "informational" posts the report and never fails; "gate" fails the check
      when erosion regresses beyond the threshold.
    required: false
    default: "informational"
  threshold:
    description: Allowed absolute erosion regression in gate mode.
    required: false
    default: "0.01"
  comment:
    description: Post or update the PR comment (pull_request events only).
    required: false
    default: "true"
  history:
    description: >-
      Trend-history file, committed in the scanned repo. On push events the
      scan is appended to it and committed back (needs `permissions:
      contents: write`, and a default branch the Actions app may push to);
      on pull requests the report comment gains a trend section when the file
      exists. Set to "" to disable.
    required: false
    default: ".code-erosion-history.jsonl"
  badge:
    description: >-
      Optional shields.io endpoint badge file (e.g. ".code-erosion-badge.json"),
      rewritten on push events and committed back with the history. Point a
      README image at https://img.shields.io/endpoint?url=<raw-url>. Empty
      disables the badge.
    required: false
    default: ""
  python-version:
    description: Python version for the scanner.
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install code-erosion
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Scan and compare
      id: compare
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        BASELINE: ${{ inputs.baseline }}
        MODE: ${{ inputs.mode }}
        THRESHOLD: ${{ inputs.threshold }}
        HISTORY: ${{ inputs.history }}
      run: |
        set -u
        comment="$RUNNER_TEMP/code-erosion-comment.md"
        echo "CODE_EROSION_COMMENT=$comment" >> "$GITHUB_ENV"
        suggestions="$RUNNER_TEMP/code-erosion-suggestions.json"
        instructions="$RUNNER_TEMP/code-erosion-agent-instructions.md"
        suggestions_md="$RUNNER_TEMP/code-erosion-suggestions.md"
        echo "CODE_EROSION_SUGGESTIONS=$suggestions" >> "$GITHUB_ENV"
        echo "CODE_EROSION_AGENT_INSTRUCTIONS=$instructions" >> "$GITHUB_ENV"
        code-erosion "$SCAN_PATH" --suggestions-out "$suggestions" \
          --agent-instructions-out "$instructions" \
          --suggestions-markdown-out "$suggestions_md" > /dev/null
        hist_arg=""
        if [ -n "$HISTORY" ] && [ -f "$HISTORY" ]; then hist_arg="--history $HISTORY"; fi
        if [ ! -f "$BASELINE" ]; then
          echo "No baseline at $BASELINE - generating a seed for you to commit."
          code-erosion "$SCAN_PATH" --write-baseline "$BASELINE" --json > /dev/null
          {
            echo "<!-- code-erosion-report -->"
            echo "## code-erosion report"
            echo ""
            echo "No baseline was committed at \`$BASELINE\`, so there is nothing to gate on yet."
            echo "A seed baseline has been generated at that path in this run's workspace -"
            echo "re-run locally with \`code-erosion . --write-baseline $BASELINE\`, commit the"
            echo "file, and future PRs will diff and gate against it."
          } > "$comment"
          cat "$suggestions_md" >> "$comment"
          exit 0
        fi
        extra=""
        if [ "$MODE" = "informational" ]; then extra="--informational"; fi
        set +e
        code-erosion "$SCAN_PATH" --check-baseline "$BASELINE" \
          --threshold "$THRESHOLD" $extra $hist_arg --comment-out "$comment" > /dev/null
        status=$?
        set -e
        cat "$suggestions_md" >> "$comment"
        if [ $status -ne 0 ]; then
          echo "::error::code-erosion gate failed - see the job summary and PR comment for the diff."
          exit $status
        fi

    - name: Record trend history
      if: github.event_name == 'push' && inputs.history != ''
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        HISTORY: ${{ inputs.history }}
        BADGE: ${{ inputs.badge }}
      run: |
        set -u
        if ! code-erosion "$SCAN_PATH" --record-history "$HISTORY" --sha "$GITHUB_SHA" \
            ${BADGE:+--write-badge "$BADGE"} > /dev/null; then
          echo "::warning::code-erosion: history recording failed; the gate result is unaffected."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$HISTORY" ${BADGE:+"$BADGE"}
        if git diff --cached --quiet; then
          echo "code-erosion: history already up to date."
          exit 0
        fi
        git commit --quiet -m "code-erosion: record scan ${GITHUB_SHA:0:7} [skip ci]"
        if git push origin "HEAD:$GITHUB_REF_NAME" 2>/dev/null; then
          echo "code-erosion: trend history committed."
        elif git pull --rebase --autostash 2>/dev/null && git push origin "HEAD:$GITHUB_REF_NAME" 2>/dev/null; then
          echo "code-erosion: trend history committed after rebase."
        else
          echo "::warning::code-erosion: could not commit the trend history. The workflow needs 'permissions: contents: write', and a protected default branch must allow the Actions app to push. The scan and gate are unaffected."
        fi


    - name: Upload agent refactoring worklist
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-erosion-suggestions
        path: |
          ${{ env.CODE_EROSION_SUGGESTIONS }}
          ${{ env.CODE_EROSION_AGENT_INSTRUCTIONS }}
        if-no-files-found: warn

    - name: Write job summary
      if: always()
      shell: bash
      run: cat "$CODE_EROSION_COMMENT" >> "$GITHUB_STEP_SUMMARY"

    - name: Post or update the PR comment
      if: always() && github.event_name == 'pull_request' && inputs.comment == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.CODE_EROSION_COMMENT, 'utf8');
          const marker = '<!-- code-erosion-report -->';
          try {
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
          } catch (error) {
            // Usually a token without pull-requests:write. The report is in the
            // job summary, so degrade instead of failing the run.
            core.warning(`code-erosion: could not post the PR comment (${error.message}). See the job summary.`);
          }
