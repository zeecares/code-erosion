[project]
name = "code-erosion"
version = "0.1.0"
description = "Measure code verbosity and structural erosion (SlopCodeBench metrics) for Python and TypeScript repos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript>=0.23",
    "ast-grep-cli>=0.42",
]

[project.scripts]
code-erosion = "code_erosion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
